<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChatWave - Settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <div class="header-title">Settings</div>
            <div class="header-avatar" onclick="goToSettings()">
                <div class="avatar-small" id="headerAvatar">U</div>
            </div>
        </div>

        <div class="content-area">
            <div class="settings-section">
                <div class="settings-card">
                    <div class="profile-edit">
                        <div class="avatar-large" id="profileAvatar" onclick="showMaintenancePopup()">U</div>
                        <input type="text" id="profileName" class="settings-input" placeholder="Display Name">
                        <textarea id="profileBio" class="settings-input" placeholder="Bio" rows="2"></textarea>
                        <button class="auth-btn" onclick="saveProfile()">Save Profile</button>
                    </div>
                </div>
                <div class="settings-card">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span><i class="fas fa-moon"></i> Dark Mode</span>
                        <span id="themeStatus">Off</span>
                    </div>
                </div>
                <div class="settings-card">
                    <div class="notification-toggle" onclick="requestNotificationPermission()">
                        <span><i class="fas fa-bell"></i> Notifications</span>
                        <span id="notifStatus">Click to enable</span>
                    </div>
                </div>
                <div class="settings-card">
                    <button class="auth-btn logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item" onclick="location.href='home.html'"><i class="fas fa-home nav-icon"></i><span>Home</span></button>
            <button class="nav-item" onclick="location.href='chat.html'"><i class="fas fa-comment nav-icon"></i><span>Chats</span></button>
            <button class="nav-item" onclick="location.href='groups.html'"><i class="fas fa-users nav-icon"></i><span>Groups</span></button>
            <button class="nav-item active" onclick="location.href='settings.html'"><i class="fas fa-cog nav-icon"></i><span>Settings</span></button>
        </div>
    </div>

    <div id="maintenancePopup" class="modal">
        <div class="modal-content">
            <h3><i class="fas fa-tools"></i> Maintenance Mode</h3>
            <p>Image/Video upload is currently under maintenance.</p>
            <button class="auth-btn" onclick="closeMaintenancePopup()">OK</button>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="notifications.js"></script>
    <script src="settings.js"></script>
</body>
</html>

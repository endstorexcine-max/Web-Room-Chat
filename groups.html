<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChatWave - Groups</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <div class="header-title">Groups</div>
            <div class="header-avatar" onclick="goToSettings()">
                <div class="avatar-small" id="headerAvatar">U</div>
            </div>
        </div>

        <div class="content-area">
            <div class="groups-list" id="groupsList">
                <div class="empty-state">Loading groups...</div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item" onclick="location.href='home.html'"><i class="fas fa-home nav-icon"></i><span>Home</span></button>
            <button class="nav-item" onclick="location.href='chat.html'"><i class="fas fa-comment nav-icon"></i><span>Chats</span></button>
            <button class="nav-item active" onclick="location.href='groups.html'"><i class="fas fa-users nav-icon"></i><span>Groups</span></button>
            <button class="nav-item" onclick="location.href='settings.html'"><i class="fas fa-cog nav-icon"></i><span>Settings</span></button>
        </div>

        <button class="fab" id="fabBtn" onclick="showCreateGroupModal()"><i class="fas fa-plus"></i></button>
    </div>

    <div id="groupModal" class="modal">
        <div class="modal-content">
            <h3>Create Group</h3>
            <input type="text" id="groupName" class="settings-input" placeholder="Group Name">
            <div id="groupMembersList" class="members-list"></div>
            <button class="auth-btn" onclick="createGroup()">Create</button>
            <button class="auth-btn" onclick="closeGroupModal()" style="background: var(--danger);">Cancel</button>
        </div>
    </div>

    <div id="maintenancePopup" class="modal">
        <div class="modal-content">
            <h3><i class="fas fa-tools"></i> Maintenance Mode</h3>
            <p>Image/Video upload is currently under maintenance.</p>
            <button class="auth-btn" onclick="closeMaintenancePopup()">OK</button>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="groups.js"></script>
</body>
</html>

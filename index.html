<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChatWave - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo"><i class="fas fa-comment-dots"></i></div>
            <div class="splash-title">ChatWave</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
    </div>

    <div class="maintenance-overlay" id="maintenanceOverlay" style="display: none;">
        <i class="fas fa-tools"></i>
        <h1>Under Maintenance</h1>
        <p>ChatWave is currently being updated. Please come back later!</p>
    </div>

    <div class="login-modal" id="loginModal">
        <div class="login-container">
            <h2><i class="fas fa-comment-dots"></i> ChatWave</h2>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('register')">Register</button>
            </div>
            <div id="loginForm" class="auth-form active">
                <input type="text" id="loginUsername" placeholder="Username">
                <input type="password" id="loginPassword" placeholder="Password">
                <div id="loginError" class="error-msg"></div>
                <button class="auth-btn" onclick="login()">Login</button>
            </div>
            <div id="registerForm" class="auth-form">
                <input type="text" id="regUsername" placeholder="Username (min 8 chars)">
                <input type="tel" id="regPhone" placeholder="Phone Number">
                <input type="password" id="regPassword" placeholder="Password (min 8 chars + number)">
                <input type="password" id="regConfirm" placeholder="Confirm Password">
                <div id="regError" class="error-msg"></div>
                <button class="auth-btn" id="regBtn" onclick="register()">Create Account</button>
                <div id="regCooldown" class="cooldown-text"></div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>

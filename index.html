<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatWave - AryaX</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-storage-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f0f2f5;
            --bg-card: #ffffff;
            --bg-chat: #efeae2;
            --bg-message-out: #d9fdd3;
            --bg-message-in: #ffffff;
            --text-primary: #111b21;
            --text-secondary: #667781;
            --border: #e9edef;
            --input-bg: #f0f2f5;
            --accent: #00a884;
            --accent-hover: #008f72;
            --danger: #e74c3c;
            --online: #25d366;
            --status-ring: #00a884;
        }

        body.dark {
            --bg-primary: #111b21;
            --bg-secondary: #202c33;
            --bg-card: #202c33;
            --bg-chat: #0b141a;
            --bg-message-out: #005c4b;
            --bg-message-in: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --border: #2a3942;
            --input-bg: #2a3942;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* ==================== SPLASH SCREEN ==================== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .splash-content {
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }

        .splash-logo {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        .splash-title {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }

        .splash-subtitle {
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 250px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
            margin: 20px auto;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: white;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .loading-text {
            color: white;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .creator {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .splash-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-container {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            margin: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .login-container h2 {
            color: var(--accent);
            font-size: 2rem;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            border-radius: 24px;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: var(--accent);
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            margin-bottom: 16px;
            font-size: 1rem;
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 28px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.8rem;
            margin-top: -8px;
            margin-bottom: 16px;
            display: none;
        }

        /* Main App */
        .app-container {
            display: none;
            height: 100vh;
            flex-direction: column;
            background: var(--bg-primary);
        }

        /* Header */
        .app-header {
            background: var(--bg-secondary);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-avatar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-small {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* Bottom Navigation */
        .bottom-nav {
            background: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 16px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon {
            font-size: 1.5rem;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-primary);
        }

        .page {
            display: none;
            height: 100%;
            overflow-y: auto;
        }

        .page.active {
            display: block;
        }

        /* Lists */
        .users-list, .chats-list, .status-list {
            padding: 12px;
        }

        .user-item, .chat-item, .status-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid var(--border);
        }

        .user-item:hover, .chat-item:hover, .status-item:hover {
            background: var(--input-bg);
        }

        .user-avatar, .chat-avatar, .status-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .status-avatar {
            border: 2px solid var(--status-ring);
        }

        .user-info, .chat-info, .status-info {
            flex: 1;
            min-width: 0;
        }

        .user-name, .chat-name, .status-name {
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .user-bio, .chat-preview, .status-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: var(--online);
            border-radius: 50%;
            display: inline-block;
        }

        /* Chat Room */
        .chat-room {
            display: none;
            flex-direction: column;
            height: 100%;
            background: var(--bg-chat);
        }

        .chat-room.active {
            display: flex;
        }

        .chat-header {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-primary);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }

        .message-out {
            background: var(--bg-message-out);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-in {
            background: var(--bg-message-in);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-media {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .message-text {
            font-size: 0.95rem;
        }

        .message-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 4px;
        }

        .message-time {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        .read-status {
            font-size: 0.65rem;
        }

        .chat-input-area {
            padding: 12px 16px;
            background: var(--bg-secondary);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .media-buttons {
            display: flex;
            gap: 8px;
        }

        .media-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--input-bg);
            border: none;
            border-radius: 28px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .chat-input:focus {
            outline: none;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Typing Indicator */
        .typing-bubble {
            align-self: flex-start;
            background: var(--bg-message-in);
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* Status View Modal */
        .status-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: black;
            z-index: 3000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .status-view.active {
            display: flex;
        }

        .status-media {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }

        .status-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            font-size: 1.5rem;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Settings Page */
        .settings-section {
            padding: 20px;
        }

        .settings-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .profile-edit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .profile-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
        }

        .settings-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .settings-textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
        }

        .settings-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 28px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }

        .logout-btn {
            background: var(--danger);
        }

        .theme-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .hidden {
            display: none !important;
        }

        /* My Status Card */
        .my-status-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 16px;
            margin: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--border);
        }

        .add-status-btn {
            background: var(--accent);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            color: white;
            cursor: pointer;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .message {
                max-width: 85%;
            }
            .user-avatar, .chat-avatar {
                width: 45px;
                height: 45px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .nav-item {
                padding: 6px 8px;
            }
            .nav-icon {
                font-size: 1.2rem;
            }
            .nav-item span {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <!-- SPLASH SCREEN -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">💬</div>
            <div class="splash-title">ChatWave</div>
            <div class="splash-subtitle">Like WhatsApp - Real-time Chat</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="loading-text" id="loadingText">Loading...</div>
            <div class="creator">Created by JNTDarkAI | v1.0</div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="login-modal">
        <div class="login-container">
            <h2>💬 ChatWave</h2>
            <p class="login-subtitle">Real-time chat with friends</p>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('register')">Register</button>
            </div>

            <div id="loginForm" class="auth-form active">
                <input type="text" id="loginUsername" placeholder="Username" autocomplete="off">
                <input type="password" id="loginPassword" placeholder="Password">
                <div id="loginError" class="error-msg"></div>
                <button class="auth-btn" onclick="login()">Login</button>
            </div>

            <div id="registerForm" class="auth-form">
                <input type="text" id="regUsername" placeholder="Username (min 8 chars)">
                <input type="password" id="regPassword" placeholder="Password (min 8 chars + number)">
                <input type="password" id="regConfirm" placeholder="Confirm Password">
                <div id="regError" class="error-msg"></div>
                <button class="auth-btn" onclick="register()">Create Account</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="appContainer" class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="header-title" id="headerTitle">ChatWave</div>
            <div class="header-avatar">
                <div class="avatar-small" id="headerAvatar" onclick="goToSettings()">U</div>
            </div>
        </div>

        <!-- Content Area (Pages) -->
        <div class="content-area" id="contentArea">
            <!-- Chats Page -->
            <div id="chatsPage" class="page active">
                <div class="chats-list" id="chatsList">
                    <div class="empty-state">Loading chats...</div>
                </div>
            </div>

            <!-- Users Page -->
            <div id="usersPage" class="page">
                <div class="users-list" id="usersList">
                    <div class="empty-state">Loading users...</div>
                </div>
            </div>

            <!-- Status Page -->
            <div id="statusPage" class="page">
                <div class="my-status-card">
                    <div class="avatar-small" id="myStatusAvatar" style="width: 50px; height: 50px;">U</div>
                    <div class="user-info">
                        <div class="user-name">My Status</div>
                        <div class="user-bio" id="myStatusText">Tap to add status update</div>
                    </div>
                    <button class="add-status-btn" onclick="addStatus()">+</button>
                </div>
                <div class="status-list" id="statusList">
                    <div class="empty-state">No status updates</div>
                </div>
            </div>

            <!-- Settings Page -->
            <div id="settingsPage" class="page">
                <div class="settings-section">
                    <div class="settings-card">
                        <div class="profile-edit">
                            <div class="profile-avatar-large" id="profileAvatar">U</div>
                            <input type="text" id="profileName" class="settings-input" placeholder="Display Name" maxlength="30">
                            <textarea id="profileBio" class="settings-textarea" placeholder="Bio / Status" maxlength="100"></textarea>
                            <button class="settings-btn" onclick="saveProfile()">Save Profile</button>
                        </div>
                    </div>

                    <div class="settings-card">
                        <div class="theme-toggle" onclick="toggleTheme()">
                            <span>🌓 Dark Mode</span>
                            <span id="themeStatus">Off</span>
                        </div>
                    </div>

                    <div class="settings-card">
                        <button class="settings-btn logout-btn" onclick="logout()">🚪 Logout</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Room (separate from pages) -->
        <div id="chatRoom" class="chat-room">
            <div class="chat-header">
                <button class="back-btn" onclick="closeChat()">←</button>
                <div class="chat-avatar" id="chatRoomAvatar">U</div>
                <div class="chat-info">
                    <div class="chat-name" id="chatRoomName">Loading...</div>
                    <div class="user-bio" id="chatRoomStatus">Online</div>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <div class="media-buttons">
                    <button class="media-btn" onclick="sendImage()">📷</button>
                    <button class="media-btn" onclick="sendVideo()">🎥</button>
                </div>
                <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." onkeyup="onTyping()" onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">📤</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchPage('chats')">
                <div class="nav-icon">💬</div>
                <span>Chats</span>
            </button>
            <button class="nav-item" onclick="switchPage('users')">
                <div class="nav-icon">👥</div>
                <span>Users</span>
            </button>
            <button class="nav-item" onclick="switchPage('status')">
                <div class="nav-icon">📸</div>
                <span>Status</span>
            </button>
            <button class="nav-item" onclick="switchPage('settings')">
                <div class="nav-icon">⚙️</div>
                <span>Settings</span>
            </button>
        </div>
    </div>

    <!-- Status View Modal -->
    <div id="statusView" class="status-view">
        <button class="status-close" onclick="closeStatusView()">✕</button>
        <img id="statusImage" class="status-media" style="display: none;">
        <video id="statusVideo" class="status-media" controls style="display: none;"></video>
    </div>

    <!-- Hidden File Inputs -->
    <input type="file" id="imageInput" accept="image/*" style="display: none;">
    <input type="file" id="videoInput" accept="video/*" style="display: none;">
    <input type="file" id="statusImageInput" accept="image/*" style="display: none;">
    <input type="file" id="statusVideoInput" accept="video/*" style="display: none;">

    <script>
        // ==================== FIREBASE CONFIG ====================
        // !!! GANTI DENGAN KONFIGURASI FIREBASE LO !!!
        const firebaseConfig = {
    apiKey: "AIzaSyDbEz99vN-vWf9N4-vI_GyXMltW1MU0MHI",
    authDomain: "chatwave-3f136.firebaseapp.com",
    databaseURL: "https://chatwave-3f136-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "chatwave-3f136",
    storageBucket: "chatwave-3f136.firebasestorage.app",
    messagingSenderId: "649075826929",
    appId: "1:649075826929:web:0b47ceecb664cbcc750950",
    measurementId: "G-JTX8B5KVV7"
  };
        // ========================================================

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();

        // Global Variables
        let currentUser = null;
        let activeChatWith = null;
        let activeChatId = null;
        let messageListener = null;
        let typingListener = null;
        let typingTimeout = null;
        let theme = localStorage.getItem('theme') || 'light';
        let avatarColors = {};

        // Apply theme
        if (theme === 'dark') document.body.classList.add('dark');

        // ==================== SPLASH SCREEN ====================
        function showSplashAndLoad() {
            const splash = document.getElementById('splashScreen');
            const progressFill = document.getElementById('progressFill');
            const loadingText = document.getElementById('loadingText');
            
            let progress = 0;
            const steps = [
                { progress: 20, text: 'Initializing Firebase...' },
                { progress: 40, text: 'Checking connection...' },
                { progress: 60, text: 'Loading user data...' },
                { progress: 80, text: 'Setting up chat...' },
                { progress: 100, text: 'Welcome to ChatWave!' }
            ];
            
            let stepIndex = 0;
            
            const interval = setInterval(() => {
                if (stepIndex < steps.length) {
                    progressFill.style.width = steps[stepIndex].progress + '%';
                    loadingText.textContent = steps[stepIndex].text;
                    stepIndex++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => {
                        splash.classList.add('hide');
                        setTimeout(() => {
                            splash.style.display = 'none';
                            checkExistingUser();
                        }, 500);
                    }, 500);
                }
            }, 500);
        }

        // ==================== HELPER FUNCTIONS ====================
        function showNotification(msg) {
            const notif = document.createElement('div');
            notif.textContent = msg;
            notif.style.cssText = `position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 10px 20px; border-radius: 28px; z-index: 3000; font-size: 0.9rem; white-space: nowrap;`;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }

        function getAvatarLetter(name) {
            return name ? name.charAt(0).toUpperCase() : 'U';
        }

        function getAvatarColor(username) {
            if (!avatarColors[username]) {
                const colors = ['#00a884', '#25d366', '#34b7f1', '#e91e63', '#9b59b6', '#f39c12', '#1abc9c', '#e74c3c'];
                let hash = 0;
                for (let i = 0; i < username.length; i++) {
                    hash = ((hash << 5) - hash) + username.charCodeAt(i);
                    hash |= 0;
                }
                avatarColors[username] = colors[Math.abs(hash) % colors.length];
            }
            return avatarColors[username];
        }

        function formatTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== AUTH FUNCTIONS ====================
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = document.querySelectorAll('.auth-form');
            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function validateUsername(username) {
            return username && username.length >= 8;
        }

        function validatePassword(password) {
            return password && password.length >= 8 && /\d/.test(password);
        }

        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const errorEl = document.getElementById('regError');

            if (!validateUsername(username)) {
                errorEl.textContent = 'Username minimal 8 karakter';
                errorEl.style.display = 'block';
                return;
            }

            if (!validatePassword(password)) {
                errorEl.textContent = 'Password minimal 8 karakter dan harus ada angka';
                errorEl.style.display = 'block';
                return;
            }

            if (password !== confirm) {
                errorEl.textContent = 'Password tidak cocok';
                errorEl.style.display = 'block';
                return;
            }

            const snapshot = await database.ref('users/' + username).once('value');
            if (snapshot.exists()) {
                errorEl.textContent = 'Username sudah terdaftar!';
                errorEl.style.display = 'block';
                return;
            }

            await database.ref('users/' + username).set({
                username: username,
                password: password,
                displayName: username,
                bio: 'Hello! I am using ChatWave',
                createdAt: Date.now(),
                online: true,
                lastSeen: Date.now()
            });

            errorEl.style.display = 'none';
            switchTab('login');
            document.getElementById('loginUsername').value = username;
            showNotification('Akun berhasil dibuat! Silakan login.');
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            const snapshot = await database.ref('users/' + username).once('value');
            const user = snapshot.val();

            if (!user || user.password !== password) {
                errorEl.textContent = 'Username atau password salah';
                errorEl.style.display = 'block';
                return;
            }

            currentUser = username;
            localStorage.setItem('currentUser', username);

            await database.ref('users/' + username).update({ online: true, lastSeen: Date.now() });

            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            
            setupPresenceListener();
            loadUserProfile();
            loadChats();
            loadUsers();
            loadStatuses();
            
            showNotification(`Welcome ${user.displayName || username}!`);
        }

        async function logout() {
            if (currentUser) {
                await database.ref('users/' + currentUser).update({ online: false, lastSeen: Date.now() });
            }
            currentUser = null;
            localStorage.removeItem('currentUser');
            if (messageListener) messageListener();
            if (typingListener) typingListener();
            closeChat();
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
            showNotification('Logged out');
        }

        function setupPresenceListener() {
            const userStatusRef = database.ref('users/' + currentUser);
            userStatusRef.onDisconnect().update({ online: false, lastSeen: Date.now() });
        }

        async function updateLastSeen() {
            if (currentUser) {
                await database.ref('users/' + currentUser).update({ lastSeen: Date.now() });
            }
        }

        function getLastSeenText(timestamp) {
            if (!timestamp) return 'Offline';
            const now = Date.now();
            const diff = now - timestamp;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return 'Online';
            if (minutes < 60) return `Last seen ${minutes} minutes ago`;
            if (hours < 24) return `Last seen ${hours} hours ago`;
            return `Last seen ${days} days ago`;
        }

        // ==================== TYPING INDICATOR ====================
        function onTyping() {
            if (!activeChatWith || !activeChatId) return;
            
            const typingRef = database.ref(`typing/${activeChatId}`);
            typingRef.set({
                user: currentUser,
                timestamp: Date.now()
            });
            
            if (typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                typingRef.remove();
            }, 2000);
        }

        function setupTypingListener() {
            if (!activeChatId) return;
            
            if (typingListener) typingListener();
            typingListener = database.ref(`typing/${activeChatId}`).on('value', (snapshot) => {
                const typingData = snapshot.val();
                const existingTyping = document.getElementById('typingIndicator');
                
                if (typingData && typingData.user !== currentUser && (Date.now() - typingData.timestamp) < 3000) {
                    if (!existingTyping) {
                        const typingDiv = document.createElement('div');
                        typingDiv.id = 'typingIndicator';
                        typingDiv.className = 'typing-bubble';
                        typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
                        const container = document.getElementById('chatMessages');
                        container.appendChild(typingDiv);
                        container.scrollTop = container.scrollHeight;
                    }
                } else {
                    if (existingTyping) existingTyping.remove();
                }
            });
        }

        // ==================== PROFILE FUNCTIONS ====================
        async function loadUserProfile() {
            const snapshot = await database.ref('users/' + currentUser).once('value');
            const user = snapshot.val();
            if (user) {
                document.getElementById('profileName').value = user.displayName || user.username;
                document.getElementById('profileBio').value = user.bio || '';
                const letter = getAvatarLetter(user.displayName || user.username);
                document.getElementById('profileAvatar').textContent = letter;
                document.getElementById('headerAvatar').textContent = letter;
                document.getElementById('myStatusAvatar').textContent = letter;
                document.getElementById('myStatusAvatar').style.background = getAvatarColor(currentUser);
            }
        }

        async function saveProfile() {
            const displayName = document.getElementById('profileName').value.trim() || currentUser;
            const bio = document.getElementById('profileBio').value.trim() || '';
            
            await database.ref('users/' + currentUser).update({
                displayName: displayName,
                bio: bio
            });
            
            loadUserProfile();
            loadChats();
            loadUsers();
            showNotification('Profile updated!');
        }

        function goToSettings() {
            switchPage('settings');
        }

        // ==================== USERS LIST ====================
        async function loadUsers() {
            const usersList = document.getElementById('usersList');
            const snapshot = await database.ref('users').once('value');
            const users = snapshot.val();
            
            if (!users) {
                usersList.innerHTML = '<div class="empty-state">No users found</div>';
                return;
            }
            
            const userList = Object.keys(users)
                .filter(u => u !== currentUser)
                .map(u => ({ username: u, ...users[u] }));
            
            if (userList.length === 0) {
                usersList.innerHTML = '<div class="empty-state">No other users found</div>';
                return;
            }
            
            usersList.innerHTML = userList.map(u => `
                <div class="user-item" onclick="startChat('${u.username}')">
                    <div class="user-avatar" style="background: ${getAvatarColor(u.username)}">${getAvatarLetter(u.displayName || u.username)}</div>
                    <div class="user-info">
                        <div class="user-name">${escapeHtml(u.displayName || u.username)}${u.online ? '<span class="online-dot"></span>' : ''}</div>
                        <div class="user-bio">${escapeHtml(u.bio || 'No bio')}</div>
                    </div>
                </div>
            `).join('');
        }

        // ==================== CHATS LIST ====================
        async function loadChats() {
            const chatsList = document.getElementById('chatsList');
            const messagesRef = database.ref('messages');
            const snapshot = await messagesRef.once('value');
            const allMessages = snapshot.val() || {};
            
            const chatPartners = new Set();
            
            for (const [chatId] of Object.entries(allMessages)) {
                if (chatId && chatId.includes('_')) {
                    const parts = chatId.split('_');
                    if (parts.length === 2) {
                        const otherUser = parts[0] === currentUser ? parts[1] : parts[0];
                        if (otherUser && otherUser !== currentUser) {
                            chatPartners.add(otherUser);
                        }
                    }
                }
            }
            
            if (chatPartners.size === 0) {
                chatsList.innerHTML = '<div class="empty-state">No chats yet. Search users to start chatting!</div>';
                return;
            }
            
            const usersSnapshot = await database.ref('users').once('value');
            const users = usersSnapshot.val() || {};
            
            const chats = [];
            for (const partner of chatPartners) {
                const user = users[partner] || { displayName: partner, bio: '', online: false };
                const chatId = [currentUser, partner].sort().join('_');
                const lastMsgSnapshot = await database.ref(`messages/${chatId}`).limitToLast(1).once('value');
                const lastMsg = lastMsgSnapshot.val();
                let lastMessageText = '';
                if (lastMsg) {
                    const lastMsgData = Object.values(lastMsg)[0];
                    if (lastMsgData) {
                        lastMessageText = lastMsgData.type === 'text' ? lastMsgData.text : (lastMsgData.type === 'image' ? '📷 Image' : '🎥 Video');
                    }
                }
                chats.push({
                    username: partner,
                    displayName: user.displayName || partner,
                    bio: user.bio || '',
                    lastMessage: lastMessageText,
                    online: user.online || false
                });
            }
            
            chatsList.innerHTML = chats.map(chat => `
                <div class="chat-item" onclick="startChat('${chat.username}')">
                    <div class="chat-avatar" style="background: ${getAvatarColor(chat.username)}">${getAvatarLetter(chat.displayName)}</div>
                    <div class="chat-info">
                        <div class="chat-name">${escapeHtml(chat.displayName)}${chat.online ? '<span class="online-dot"></span>' : ''}</div>
                        <div class="chat-preview">${escapeHtml(chat.lastMessage || 'Tap to start chatting')}</div>
                    </div>
                </div>
            `).join('');
        }

        // ==================== CHAT FUNCTIONS ====================
        async function startChat(otherUser) {
            activeChatWith = otherUser;
            activeChatId = [currentUser, otherUser].sort().join('_');
            
            const snapshot = await database.ref('users/' + otherUser).once('value');
            const user = snapshot.val() || {};
            
            document.getElementById('chatRoomName').textContent = user.displayName || otherUser;
            document.getElementById('chatRoomStatus').innerHTML = user.online ? 'Online' : getLastSeenText(user.lastSeen);
            document.getElementById('chatRoomAvatar').textContent = getAvatarLetter(user.displayName || otherUser);
            document.getElementById('chatRoomAvatar').style.background = getAvatarColor(otherUser);
            
            // Hide content area, show chat room
            document.getElementById('contentArea').style.display = 'none';
            document.getElementById('chatRoom').classList.add('active');
            document.querySelector('.bottom-nav').style.display = 'none';
            
            // Clear messages container
            document.getElementById('chatMessages').innerHTML = '';
            
            // Setup message listener
            if (messageListener) messageListener();
            messageListener = database.ref('messages/' + activeChatId).on('value', (snapshot) => {
                renderMessages(snapshot.val());
            });
            
            setupTypingListener();
            await markMessagesAsRead();
            
            // Focus input
            setTimeout(() => {
                const input = document.getElementById('messageInput');
                if (input) input.focus();
            }, 300);
        }

        async function markMessagesAsRead() {
            const messagesRef = database.ref(`messages/${activeChatId}`);
            const snapshot = await messagesRef.once('value');
            const messages = snapshot.val();
            if (messages) {
                for (const [msgId, msg] of Object.entries(messages)) {
                    if (msg && msg.sender !== currentUser && !msg.read) {
                        await messagesRef.child(msgId).update({ read: true, readAt: Date.now() });
                    }
                }
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!messages || Object.keys(messages).length === 0) {
                container.innerHTML = '<div class="empty-state">No messages yet. Start the conversation!</div>';
                return;
            }
            
            const messagesArray = Object.entries(messages)
                .map(([id, msg]) => ({ id, ...msg }))
                .filter(msg => msg && msg.sender)
                .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            
            container.innerHTML = messagesArray.map(msg => `
                <div class="message ${msg.sender === currentUser ? 'message-out' : 'message-in'}">
                    ${msg.type === 'image' ? `<img src="${msg.url}" class="message-media" onclick="viewMedia('${msg.url}', 'image')">` : ''}
                    ${msg.type === 'video' ? `<video src="${msg.url}" class="message-media" controls onclick="event.stopPropagation()"></video>` : ''}
                    ${msg.type === 'text' ? `<div class="message-text">${escapeHtml(msg.text)}</div>` : ''}
                    <div class="message-footer">
                        <span class="message-time">${msg.time}</span>
                        ${msg.sender === currentUser ? `<span class="read-status">${msg.read ? '✓✓' : '✓'}</span>` : ''}
                    </div>
                </div>
            `).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !activeChatWith) return;
            
            if (typingTimeout) clearTimeout(typingTimeout);
            await database.ref(`typing/${activeChatId}`).remove();
            
            const newMessage = {
                sender: currentUser,
                type: 'text',
                text: text,
                time: formatTime(),
                timestamp: Date.now(),
                read: false
            };
            
            await database.ref('messages/' + activeChatId).push(newMessage);
            input.value = '';
            loadChats();
        }

        function sendImage() {
            const input = document.getElementById('imageInput');
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file || !activeChatWith) return;
                
                showNotification('Uploading image...');
                const storageRef = storage.ref(`images/${activeChatId}/${Date.now()}_${file.name}`);
                await storageRef.put(file);
                const url = await storageRef.getDownloadURL();
                
                const newMessage = {
                    sender: currentUser,
                    type: 'image',
                    url: url,
                    time: formatTime(),
                    timestamp: Date.now(),
                    read: false
                };
                
                await database.ref('messages/' + activeChatId).push(newMessage);
                loadChats();
                showNotification('Image sent!');
            };
            input.click();
        }

        function sendVideo() {
            const input = document.getElementById('videoInput');
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file || !activeChatWith) return;
                
                if (file.size > 10 * 1024 * 1024) {
                    showNotification('Video too large (max 10MB)');
                    return;
                }
                
                showNotification('Uploading video...');
                const storageRef = storage.ref(`videos/${activeChatId}/${Date.now()}_${file.name}`);
                await storageRef.put(file);
                const url = await storageRef.getDownloadURL();
                
                const newMessage = {
                    sender: currentUser,
                    type: 'video',
                    url: url,
                    time: formatTime(),
                    timestamp: Date.now(),
                    read: false
                };
                
                await database.ref('messages/' + activeChatId).push(newMessage);
                loadChats();
                showNotification('Video sent!');
            };
            input.click();
        }

        function closeChat() {
            if (messageListener) messageListener();
            if (typingListener) typingListener();
            messageListener = null;
            typingListener = null;
            if (typingTimeout) clearTimeout(typingTimeout);
            activeChatWith = null;
            activeChatId = null;
            
            document.getElementById('contentArea').style.display = 'block';
            document.getElementById('chatRoom').classList.remove('active');
            document.querySelector('.bottom-nav').style.display = 'flex';
            
            loadChats();
            loadUsers();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        }

        function viewMedia(url, type) {
            const view = document.getElementById('statusView');
            const img = document.getElementById('statusImage');
            const video = document.getElementById('statusVideo');
            
            img.style.display = 'none';
            video.style.display = 'none';
            
            if (type === 'image') {
                img.src = url;
                img.style.display = 'block';
            } else {
                video.src = url;
                video.style.display = 'block';
            }
            
            view.classList.add('active');
        }

        // ==================== STATUS FUNCTIONS ====================
        function addStatus() {
            const choice = confirm('Post image or video status?');
            if (choice) {
                const input = document.getElementById('statusImageInput');
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    showNotification('Uploading status...');
                    const storageRef = storage.ref(`status/${currentUser}/${Date.now()}_${file.name}`);
                    await storageRef.put(file);
                    const url = await storageRef.getDownloadURL();
                    
                    await database.ref(`status/${currentUser}`).set({
                        type: 'image',
                        url: url,
                        time: Date.now(),
                        expires: Date.now() + 24 * 60 * 60 * 1000
                    });
                    
                    loadStatuses();
                    showNotification('Status posted!');
                };
                input.click();
            } else {
                const input = document.getElementById('statusVideoInput');
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    if (file.size > 10 * 1024 * 1024) {
                        showNotification('Video too large (max 10MB)');
                        return;
                    }
                    
                    showNotification('Uploading status...');
                    const storageRef = storage.ref(`status/${currentUser}/${Date.now()}_${file.name}`);
                    await storageRef.put(file);
                    const url = await storageRef.getDownloadURL();
                    
                    await database.ref(`status/${currentUser}`).set({
                        type: 'video',
                        url: url,
                        time: Date.now(),
                        expires: Date.now() + 24 * 60 * 60 * 1000
                    });
                    
                    loadStatuses();
                    showNotification('Status posted!');
                };
                input.click();
            }
        }

        async function loadStatuses() {
            const statusList = document.getElementById('statusList');
            const snapshot = await database.ref('status').once('value');
            const allStatuses = snapshot.val() || {};
            
            const now = Date.now();
            const validStatuses = [];
            
            for (const [user, status] of Object.entries(allStatuses)) {
                if (status && status.expires && status.expires > now && user !== currentUser) {
                    const userSnapshot = await database.ref('users/' + user).once('value');
                    const userData = userSnapshot.val();
                    validStatuses.push({
                        username: user,
                        displayName: userData?.displayName || user,
                        ...status
                    });
                }
            }
            
            if (validStatuses.length === 0) {
                statusList.innerHTML = '<div class="empty-state">No status updates from friends</div>';
                return;
            }
            
            statusList.innerHTML = validStatuses.map(s => `
                <div class="status-item" onclick="viewStatus('${s.url}', '${s.type}')">
                    <div class="status-avatar" style="background: ${getAvatarColor(s.username)}">${getAvatarLetter(s.displayName)}</div>
                    <div class="status-info">
                        <div class="status-name">${escapeHtml(s.displayName)}</div>
                        <div class="status-time">${new Date(s.time).toLocaleString()}</div>
                    </div>
                </div>
            `).join('');
            
            const myStatus = allStatuses[currentUser];
            if (myStatus && myStatus.expires > now) {
                document.getElementById('myStatusText').textContent = 'View my status';
                document.getElementById('myStatusAvatar').style.border = '2px solid var(--status-ring)';
            } else {
                document.getElementById('myStatusText').textContent = 'Tap to add status update';
                document.getElementById('myStatusAvatar').style.border = 'none';
            }
        }

        function viewStatus(url, type) {
            const view = document.getElementById('statusView');
            const img = document.getElementById('statusImage');
            const video = document.getElementById('statusVideo');
            
            img.style.display = 'none';
            video.style.display = 'none';
            
            if (type === 'image') {
                img.src = url;
                img.style.display = 'block';
            } else {
                video.src = url;
                video.style.display = 'block';
            }
            
            view.classList.add('active');
        }

        function closeStatusView() {
            document.getElementById('statusView').classList.remove('active');
            document.getElementById('statusImage').src = '';
            document.getElementById('statusVideo').src = '';
        }

        // ==================== PAGE NAVIGATION ====================
        function switchPage(page) {
            const pages = ['chatsPage', 'usersPage', 'statusPage', 'settingsPage'];
            pages.forEach(p => {
                document.getElementById(p).classList.remove('active');
            });
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if (page === 'chats') {
                document.getElementById('chatsPage').classList.add('active');
                document.querySelectorAll('.nav-item')[0].classList.add('active');
                document.getElementById('headerTitle').textContent = 'Chats';
                loadChats();
            } else if (page === 'users') {
                document.getElementById('usersPage').classList.add('active');
                document.querySelectorAll('.nav-item')[1].classList.add('active');
                document.getElementById('headerTitle').textContent = 'Users';
                loadUsers();
            } else if (page === 'status') {
                document.getElementById('statusPage').classList.add('active');
                document.querySelectorAll('.nav-item')[2].classList.add('active');
                document.getElementById('headerTitle').textContent = 'Status';
                loadStatuses();
            } else if (page === 'settings') {
                document.getElementById('settingsPage').classList.add('active');
                document.querySelectorAll('.nav-item')[3].classList.add('active');
                document.getElementById('headerTitle').textContent = 'Settings';
                loadUserProfile();
            }
        }

        function toggleTheme() {
            theme = theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
            if (theme === 'dark') document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            document.getElementById('themeStatus').textContent = theme === 'dark' ? 'On' : 'Off';
        }

        // ==================== CHECK EXISTING USER ====================
        async function checkExistingUser() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                const snapshot = await database.ref('users/' + savedUser).once('value');
                if (snapshot.exists()) {
                    currentUser = savedUser;
                    document.getElementById('loginModal').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'flex';
                    setupPresenceListener();
                    loadUserProfile();
                    loadChats();
                    loadUsers();
                    loadStatuses();
                    await database.ref('users/' + currentUser).update({ online: true, lastSeen: Date.now() });
                    return;
                } else {
                    localStorage.removeItem('currentUser');
                }
            }
            document.getElementById('loginModal').style.display = 'flex';
        }

        // ==================== INIT ====================
        setInterval(() => {
            if (currentUser) updateLastSeen();
        }, 30000);

        // Start splash screen and load
        showSplashAndLoad();
    </script>
</body>
</html>
